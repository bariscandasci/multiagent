services:
  app:
    build: .
    image: bcd-command-center:1.0.0
    env_file:
      - .env
    environment:
      BIND_IP: ${BIND_IP:-127.0.0.1}
    # Host ağı: süreç 127.0.0.1:8000 ve BIND_IP:8000 dinler. 0.0.0.0 yayınlanmaz.
    network_mode: host
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  backup:
    image: alpine:3.20
    restart: unless-stopped
    volumes:
      - ./data:/app/data:ro
      - ./backups:/backups
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
